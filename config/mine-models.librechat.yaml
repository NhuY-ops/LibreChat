# MINE AI local model catalog (BYOK; never commit real API keys)
# Installed only into the existing Docker API by scripts/mine-add-models.sh.
version: 1.3.17
endpoints:
  custom:
    - name: OpenRouter
      apiKey: user_provided
      baseURL: https://openrouter.ai/api/v1
      models:
        default:
          - openrouter/auto
          - openai/gpt-5.5
          - anthropic/claude-sonnet-5.5
          - google/gemini-3.8-flash
        fetch: true
      dropParams: [stop]
      modelDisplayLabel: OpenRouter
    - name: Deepseek
      apiKey: user_provided
      baseURL: https://api.deepseek.com/v1
      models:
        default: [deepseek-chat, deepseek-reasoner]
        fetch: true
      modelDisplayLabel: DeepSeek
    - name: groq
      apiKey: user_provided
      baseURL: https://api.groq.com/openai/v1
      models:
        default: [openai/gpt-oss-120b, openai/gpt-oss-20b]
        fetch: true
      modelDisplayLabel: Groq
    - name: Mistral
      apiKey: user_provided
      baseURL: https://api.mistral.ai/v1
      models:
        default: [mistral-small-2603]
        fetch: true
      modelDisplayLabel: Mistral
    - name: xai
      apiKey: user_provided
      baseURL: https://api.x.ai/v1
      models:
        default: [grok-4]
        fetch: true
      modelDisplayLabel: Grok
